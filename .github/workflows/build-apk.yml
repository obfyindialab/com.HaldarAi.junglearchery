name: Build and Publish Debug & Unsigned Release APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version detected: $JAVA_RAW_VERSION"

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{print $2}')
          fi

          if [ -z "$JAVA_MAJOR" ] \vert{}\vert{} ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore not found after creation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build the APKs (Debug & Unsigned Release)
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APKs
        run: |
          EXPECTED_DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ ! -f "$EXPECTED_DEBUG_APK" ]; then
            echo "ERROR: Expected Debug APK not found at $EXPECTED_DEBUG_APK"
            exit 1
          fi

          if [ ! -s "$EXPECTED_DEBUG_APK" ]; then
            echo "ERROR: Debug APK at $EXPECTED_DEBUG_APK is empty."
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_RELEASE_APK" ]; then
            echo "ERROR: Expected Unsigned Release APK not found at $EXPECTED_RELEASE_APK"
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_RELEASE_APK" ]; then
            echo "ERROR: Unsigned Release APK at $EXPECTED_RELEASE_APK is empty."
            exit 1
          fi

          echo "Verified both debug and unsigned release APKs exist and are non-empty."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g')
          
          DEBUG_ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEBUG_ASSET_PATH="${TEMP_DIR}/${DEBUG_ASSET_FILENAME}"
          
          UNSIGNED_ASSET_FILENAME="${SAFE_REPO_NAME}-unsigned-release-build-${{ github.run_number }}.apk"
          UNSIGNED_ASSET_PATH="${TEMP_DIR}/${UNSIGNED_ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_ASSET_PATH"
          cp "app/build/outputs/apk/release/app-release-unsigned.apk" "$UNSIGNED_ASSET_PATH"

          if [ ! -s "$DEBUG_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare debug APK asset at $DEBUG_ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$UNSIGNED_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare unsigned release APK asset at $UNSIGNED_ASSET_PATH"
            exit 1
          fi

          echo "debug_asset_path=${DEBUG_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "debug_asset_filename=${DEBUG_ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          
          echo "unsigned_asset_path=${UNSIGNED_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "unsigned_asset_filename=${UNSIGNED_ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          
          echo "Prepared debug release asset at: $DEBUG_ASSET_PATH"
          echo "Prepared unsigned release asset at: $UNSIGNED_ASSET_PATH"

      - name: Publish APKs to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          DEBUG_ASSET_PATH="${{ steps.prepare_asset.outputs.debug_asset_path }}"
          UNSIGNED_ASSET_PATH="${{ steps.prepare_asset.outputs.unsigned_asset_path }}"

          if [ ! -s "$DEBUG_ASSET_PATH" ]; then
            echo "ERROR: Debug release asset $DEBUG_ASSET_PATH does not exist or is empty."
            exit 1
          fi
          
          if [ ! -s "$UNSIGNED_ASSET_PATH" ]; then
            echo "ERROR: Unsigned release asset $UNSIGNED_ASSET_PATH does not exist or is empty."
            exit 1
          fi

          RELEASE_TAG="apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ## APK Build Notes
          - Automatically generated APKs.
          - Built by GitHub Actions.
          - GitHub Actions run number: ${{ github.run_number }}
          - GitHub Actions run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          
          **Included APKs:**
          1.  `app-debug.apk`: Signed with a temporary debug keystore. Intended for testing.
          2.  `app-release-unsigned.apk`: Unsigned release build. Requires manual signing before installation.
          EOF
          )

          gh release create "$RELEASE_TAG" "$DEBUG_ASSET_PATH" "$UNSIGNED_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEBUG_ASSET_FILENAME="${{ steps.prepare_asset.outputs.debug_asset_filename }}"
          UNSIGNED_ASSET_FILENAME="${{ steps.prepare_asset.outputs.unsigned_asset_filename }}"
          RELEASE_TAG="apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="APK Build #${{ github.run_number }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release creation succeeded."
            RELEASE_VIEW=$(gh release view "$RELEASE_TAG" --json url,tagName,title 2>/dev/null || true)
            RELEASE_URL=$(echo "$RELEASE_VIEW" | awk -F '"url":"' '{print $2}' | awk -F '"' '{print $1}')
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi

            echo "### 🚀 APKs Released Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug APK Filename:** \`${DEBUG_ASSET_FILENAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Unsigned Release APK Filename:** \`${UNSIGNED_ASSET_FILENAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- The standard GitHub Actions artifacts \`app-debug-apk\` and \`app-release-unsigned-apk\` are also available as backups." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing was not completed or failed."
            echo "### ⚠️ Notice: APK Build Succeeded (Release Publishing Note)" >> "$GITHUB_STEP_SUMMARY"
            echo "- The APKs built successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- The Actions artifacts named **\`app-debug-apk\`** and **\`app-release-unsigned-apk\`** are available to download." >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Release publishing did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi
