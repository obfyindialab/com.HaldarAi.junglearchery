name: Build and Publish Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version detected: $JAVA_RAW_VERSION"

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{print $2}')
          fi

          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary keystores
        env:
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Configure keystore for assembleRelease
          if [ -f "./my-upload-key.jks" ]; then
            echo "Found ./my-upload-key.jks in root directory for release signing."
            # Detect key alias from the keystore if available
            ALIAS_DETECTED=$(keytool -list -v -keystore ./my-upload-key.jks -storepass "$KEYPASSWORD" 2>/dev/null | grep -i "Alias name:" | head -n 1 | awk '{print $NF}' || true)
            if [ -n "$ALIAS_DETECTED" ]; then
              echo "Detected key alias: $ALIAS_DETECTED"
              echo "KEYALIAS=$ALIAS_DETECTED" >> "$GITHUB_ENV"
            fi
          else
            echo "Notice: ./my-upload-key.jks not found directly; fallback to ./debug.keystore for release signing."
            cp ./debug.keystore ./my-upload-key.jks
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore not found after creation."
            exit 1
          fi
          echo "Keystores prepared and verified."

      - name: Build Debug and Release APKs
        env:
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          RELEASE_KEY_OPTS=""
          if [ -n "$KEYPASSWORD" ]; then
            RELEASE_KEY_OPTS="-PRELEASE_STORE_FILE=../my-upload-key.jks -PRELEASE_STORE_PASSWORD=$KEYPASSWORD -PRELEASE_KEY_PASSWORD=$KEYPASSWORD"
            if [ -n "$KEYALIAS" ]; then
              RELEASE_KEY_OPTS="$RELEASE_KEY_OPTS -PRELEASE_KEY_ALIAS=$KEYALIAS"
            fi
          fi
          gradle :app:assembleDebug :app:assembleRelease $RELEASE_KEY_OPTS --stacktrace --no-daemon

      - name: Verify APKs
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$DEBUG_APK" ]; then
            echo "Searching for debug APK:"
            find app/build/outputs/apk/debug -name "*.apk" || true
            echo "ERROR: Debug APK not found or is empty at $DEBUG_APK"
            exit 1
          fi

          if [ ! -s "$RELEASE_APK" ]; then
            echo "Searching for release APK:"
            find app/build/outputs/apk/release -name "*.apk" || true
            echo "ERROR: Release APK not found or is empty at $RELEASE_APK"
            exit 1
          fi

          echo "Verified Debug APK: $DEBUG_APK"
          echo "Verified Release APK: $RELEASE_APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare Release Assets and Source Code Archive
        id: prepare_assets
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g')

          # 1. Release APK asset
          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-release-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_ASSET_NAME}"
          cp "app/build/outputs/apk/release/app-release.apk" "$RELEASE_ASSET_PATH"

          # 2. Debug APK asset
          DEBUG_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEBUG_ASSET_PATH="${TEMP_DIR}/${DEBUG_ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_ASSET_PATH"

          # 3. Source code ZIP archive
          SRC_ZIP_NAME="${SAFE_REPO_NAME}-source-code-build-${{ github.run_number }}.zip"
          SRC_ZIP_PATH="${TEMP_DIR}/${SRC_ZIP_NAME}"
          zip -r "$SRC_ZIP_PATH" . -x "*.git*" -x "*build/*" -x "*.gradle/*" -x "*debug.keystore*" -x "*release.keystore*" -x "*my-upload-key.jks*"

          echo "release_apk_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "debug_apk_path=${DEBUG_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "src_zip_path=${SRC_ZIP_PATH}" >> "$GITHUB_OUTPUT"

          echo "release_apk_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "debug_apk_name=${DEBUG_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "src_zip_name=${SRC_ZIP_NAME}" >> "$GITHUB_OUTPUT"

          echo "Release assets prepared in $TEMP_DIR"

      - name: Upload Source Code Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code-zip
          path: ${{ steps.prepare_assets.outputs.src_zip_path }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_APK="${{ steps.prepare_assets.outputs.release_apk_path }}"
          DEBUG_APK="${{ steps.prepare_assets.outputs.debug_apk_path }}"
          SRC_ZIP="${{ steps.prepare_assets.outputs.src_zip_path }}"

          RELEASE_TAG="apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ## APK Build & Release Notes
          - **Release APK**: Production-optimized APK with minification and resource shrinking, signed with upload keystore.
          - **Debug APK**: Unobfuscated testing APK.
          - **Source Code Archive**: Included as a standalone zip asset alongside GitHub's automatic tar/zip archives.
          - Built by GitHub Actions (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }}).
          - Source commit: ${{ github.sha }}
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK" \
            "$DEBUG_APK" \
            "$SRC_ZIP" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report Download Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_APK_NAME="${{ steps.prepare_assets.outputs.release_apk_name }}"
          DEBUG_APK_NAME="${{ steps.prepare_assets.outputs.debug_apk_name }}"
          SRC_ZIP_NAME="${{ steps.prepare_assets.outputs.src_zip_name }}"
          RELEASE_TAG="apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="APK Build #${{ github.run_number }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_VIEW=$(gh release view "$RELEASE_TAG" --json url,tagName,title 2>/dev/null || true)
            RELEASE_URL=$(echo "$RELEASE_VIEW" | awk -F '"url":"' '{print $2}' | awk -F '"' '{print $1}')
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi

            echo "### 🚀 APKs and Source Code Released Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release APK:** \`${RELEASE_APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug APK:** \`${DEBUG_APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source Code Archive:** \`${SRC_ZIP_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- All assets are downloadable directly under the **Assets** section of the release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing did not complete or failed."
            echo "### ⚠️ Notice: Build Succeeded (Release Publishing Note)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Debug APK, Release APK, and Source Code archive were built and packaged successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- They are available under workflow artifacts: **\`app-release-apk\`**, **\`app-debug-apk\`**, and **\`source-code-zip\`**." >> "$GITHUB_STEP_SUMMARY"
          fi
